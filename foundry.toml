[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200
# Local Anvil defaults to timestamp 1. 00:00 UTC of that day is 0, which DcaOutManager
# treats as "never sold". Production Rootstock cannot hit that; tests should not either.
block_timestamp = 86400

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]
[lint]
exclude_lints = [
    "mixed-case-variable", 
    "unwrapped-modifier-logic", 
    "unaliased-plain-import",
    "screaming-snake-case-immutable"
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
